name: CI ProyectoBootcamp

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint y build de React
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preparar pnpm
        run: npm install --global pnpm@11.17.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad con ESLint
        run: pnpm run lint

      - name: Compilar la aplicacion React
        run: pnpm run build

      - name: Guardar dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
