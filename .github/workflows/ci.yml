name: CI/CD ProyectoBootcamp

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint y build de React
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Preparar pnpm
        run: npm install --global pnpm@11.17.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad con ESLint
        run: pnpm run lint

      - name: Compilar la aplicacion React
        run: pnpm run build

      - name: Guardar dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    name: Desplegar en Amazon S3
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el artefacto dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Autenticarse en AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sincronizar dist con el bucket S3
        run: aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Mostrar la URL publicada
        run: echo "App publicada en http://${{ vars.S3_BUCKET }}.s3-website-${{ vars.AWS_REGION }}.amazonaws.com"
