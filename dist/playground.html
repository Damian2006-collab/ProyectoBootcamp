  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-family-base);
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-bg);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 100vh;
    }

    .layout__sidebar {
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      padding: var(--space-6) var(--space-5);
    }

    .layout__sidebar .eyebrow {
      display: block;
      margin-bottom: var(--space-1);
      font-size: var(--font-size-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-primary);
    }

    .layout__sidebar h1 {
      font-size: var(--font-size-md);
      font-weight: 700;
      margin: 0 0 var(--space-6);
      color: var(--color-text);
    }

    .layout__sidebar nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .layout__sidebar nav a {
      display: inline-block;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: var(--font-size-sm);
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .layout__sidebar nav a:hover {
      background: var(--color-bg);
      color: var(--color-text);
    }

    .layout__main {
      padding: var(--space-7) var(--space-5) var(--space-10);
      counter-reset: section;
    }

    .playground-section {
      max-width: 72rem;
      margin: 0 auto var(--space-9);
      padding-bottom: var(--space-8);
      border-bottom: 1px solid var(--color-border);
    }

    .playground-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .playground-section h2 {
      font-size: var(--font-size-lg);
      font-weight: 700;
      margin: 0 0 var(--space-6);
    }

    .playground-section h2::before {
      counter-increment: section;
      content: counter(section, decimal-leading-zero);
      display: block;
      margin-bottom: var(--space-2);
      font-size: var(--font-size-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-primary);
    }

    .playground-section__grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-6);
    }

    .playground-section__demo,
    .playground-section__behavior {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: var(--space-6);
    }

    .playground-section__demo {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .playground-section__behavior h3 {
      font-size: var(--font-size-base);
      font-weight: 700;
      margin: 0 0 var(--space-4);
    }

    .playground-section__behavior dl {
      margin: 0;
    }

    .playground-section__behavior dt {
      font-weight: 700;
      font-size: var(--font-size-sm);
      margin-top: var(--space-4);
    }

    .playground-section__behavior dt:first-child {
      margin-top: 0;
    }

    .playground-section__behavior dd {
      margin: var(--space-1) 0 0;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
    }

    .playground-section__behavior code {
      font-family: ui-monospace, monospace;
      font-size: 0.85em;
      background: var(--color-bg);
      padding: 0.1em 0.4em;
      border-radius: 4px;
    }

    .menu-demo {
      position: relative;
      display: inline-block;
    }

    .demo-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
    }

    .demo-row-label {
      margin: 0;
      font-size: var(--font-size-xs);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    @media (min-width: 900px) {
      .layout {
        grid-template-columns: 17rem 1fr;
      }

      .layout__sidebar {
        border-bottom: none;
        border-right: 1px solid var(--color-border);
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .layout__sidebar nav ul {
        flex-direction: column;
      }

      .layout__sidebar nav a {
        display: block;
      }

      .playground-section__grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
